appId: teleport.example
---
# Required env: MODE, TARGET_TEXT, DURATION, plus START and END for coordinates
# or DIRECTION for an element. Keep these parameters on the runFlow call rather
# than declaring computed defaults in this helper's header.
# Web validates activation with a press until Maestro's drag command lands:
# https://github.com/mobile-dev-inc/Maestro/pull/2978
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn: ${TARGET_TEXT}
- runFlow:
    when:
      true: ${(maestro.platform == 'ios' || maestro.platform == 'android') && MODE == 'coordinates'}
    commands:
      - swipe:
          label: "Press, move, hold, and release ${TARGET_TEXT}"
          start: ${START}
          end: ${END}
          duration: ${DURATION}
- runFlow:
    when:
      true: ${(maestro.platform == 'ios' || maestro.platform == 'android') && MODE == 'element'}
    commands:
      - swipe:
          label: "Press, move, hold, and release ${TARGET_TEXT}"
          from:
            text: ${TARGET_TEXT}
          direction: ${DIRECTION}
          duration: ${DURATION}
