appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_ID: "menu"
- assertVisible:
    text: "Selected: none"

- tapOn:
    id: "select-trigger"
- tapOn:
    id: "select-option-portugal"
- assertVisible:
    text: "Selected: portugal"

- tapOn:
    id: "select-trigger"
- tapOn:
    id: "select-option-france"
- assertVisible:
    text: "Selected: france"

- tapOn:
    id: "select-trigger"
- tapOn:
    id: "select-option-italy"
- assertVisible:
    text: "Selected: italy"
