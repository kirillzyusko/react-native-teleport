appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_CATEGORY: demo
      EXAMPLE_ID: reels
- runFlow:
    file: ../subflows/start-recording.yml
    env:
      RECORDING_PATH: e2e/videos/${DEVICE}/instagram-reels
- tapOn:
    point: 50%, 35%
- extendedWaitUntil:
    visible: Reels
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/go-back.yml
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/stop-recording.yml
