appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_ID: "bottom_sheet"
- assertNotVisible:
    text: "Sheet"
- assertNotVisible:
    text: "Close"
- tapOn:
    id: "open_bottom_sheet"
- assertVisible:
    text: "Sheet"
- assertVisible:
    text: "Close"
- tapOn:
    text: "Close"
- assertNotVisible:
    text: "Sheet"
- assertNotVisible:
    text: "Close"
# Web is skipped for this scenario because Maestro does not expose a
# press/move/release pointer API there yet; `swipe` scrolls the page instead.
# Re-enable when https://github.com/mobile-dev-inc/Maestro/pull/2978 lands.
- runFlow:
    when:
      true: ${maestro.platform == 'ios' || maestro.platform == 'android'}
    commands:
      - tapOn:
          id: "open_bottom_sheet"
      - assertVisible:
          text: "Sheet"
      - assertVisible:
          text: "Close"
      - swipe:
          label: "Press, move right, hold, and release Close Bottom Sheet"
          from:
            text: "Close"
          direction: RIGHT
          duration: 3000
      - assertNotVisible:
          text: "Sheet"
      - assertNotVisible:
          text: "Close"
