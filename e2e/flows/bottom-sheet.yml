appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_ID: "bottom_sheet"
- assertNotVisible:
    text: "Sheet"
- assertNotVisible:
    text: "Close"
- tapOn:
    id: "open_bottom_sheet"
- assertVisible:
    text: "Sheet"
- assertVisible:
    text: "Close"
- tapOn:
    text: "Close"
- assertNotVisible:
    text: "Sheet"
- assertNotVisible:
    text: "Close"
- tapOn:
    id: "open_bottom_sheet"
- assertVisible:
    text: "Sheet"
- assertVisible:
    text: "Close"
# Web validates activation with a press until Maestro's drag command lands:
# https://github.com/mobile-dev-inc/Maestro/pull/2978
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn:
          text: "Close"
- runFlow:
    when:
      true: ${maestro.platform == 'ios' || maestro.platform == 'android'}
    commands:
      - swipe:
          label: "Press, move, hold, and release Close"
          from:
            text: "Close"
          direction: RIGHT
          duration: 3000
- assertNotVisible:
    text: "Sheet"
- assertNotVisible:
    text: "Close"
