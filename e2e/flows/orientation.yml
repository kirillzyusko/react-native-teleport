appId: teleport.example
---
# setOrientation is not supported on Web, so keep this regression mobile-only.
- runFlow:
    when:
      true: ${maestro.platform == 'ios' || maestro.platform == 'android'}
    commands:
      - launchApp
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - runFlow:
          file: ../subflows/open-example.yml
          env:
            EXAMPLE_ID: "orientation"
      - assertVisible:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_right_edge"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationPortrait

      # Rotate before entering fullscreen, then make sure exiting fullscreen
      # restores the same landscape source layout.
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationLandscape
      - tapOn:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_right_edge"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationLandscapeFullscreen
      - tapOn:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_toggle"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationLandscape
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - assertVisible:
          id: "orientation_right_edge"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationPortrait

      # Repeat the issue scenario by rotating multiple times while the player
      # is teleported, then verify the final source layout again.
      - tapOn:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_toggle"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationPortraitFullscreen
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - assertVisible:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_right_edge"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationLandscapeFullscreen
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationPortraitFullscreen
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationLandscapeFullscreen
      - tapOn:
          id: "orientation_toggle"
      - assertVisible:
          id: "orientation_toggle"
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - assertVisible:
          id: "orientation_right_edge"
      - runFlow:
          file: ../subflows/assert-screenshot.yml
          env:
            SCREENSHOT: OrientationPortrait
