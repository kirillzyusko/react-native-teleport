appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_CATEGORY: "fixture"
      EXAMPLE_ID: "gesture_handler_touchable"
- runFlow:
    file: ../subflows/assert-screenshot.yml
    env:
      SCREENSHOT: NotTeleported
- tapOn: "Move to portal"
- runFlow:
    file: ../subflows/assert-screenshot.yml
    env:
      SCREENSHOT: Teleported
- tapOn: "Move back"
- runFlow:
    file: ../subflows/assert-screenshot.yml
    env:
      SCREENSHOT: NotTeleported
