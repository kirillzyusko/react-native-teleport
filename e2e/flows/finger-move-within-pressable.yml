appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-example.yml
    env:
      EXAMPLE_ID: "teleportation_order"
- assertVisible:
    text: "Open First Dialog"
- tapOn:
    text: "Open First Dialog"
- assertVisible:
    text: "First Dialog"
# Web validates activation with a press until Maestro's drag command lands:
# https://github.com/mobile-dev-inc/Maestro/pull/2978
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn:
          text: "Close First Dialog"
- runFlow:
    when:
      true: ${maestro.platform == 'ios' || maestro.platform == 'android'}
    commands:
      - swipe:
          label: "Press, move, hold, and release Close First Dialog"
          start: 45%, 59%
          end: 55%, 59%
          duration: 3000
- assertNotVisible:
    text: "First Dialog"
