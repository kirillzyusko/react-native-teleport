appId: teleport.example
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    id: "teleportation_order"
- assertVisible:
    text: "Open First Dialog"
- tapOn:
    text: "Open First Dialog"
- assertVisible:
    text: "First Dialog"
- runFlow:
    file: ../subflows/press-move-release.yml
    env:
      MODE: coordinates
      TARGET_TEXT: "Close First Dialog"
      START: "45%, 59%"
      END: "55%, 59%"
      DURATION: 3000
- assertNotVisible:
    text: "First Dialog"
