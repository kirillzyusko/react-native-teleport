name: 🍏 Test iOS
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Maestro driver / simulator profile
        type: choice
        default: native-driver
        options:
          - baseline
          - apsd-stopped
          - no-spotlight
          - simctl-stop
          - recap-source
          - native-driver
          - hid-contract
          - indigo
      comparison:
        description: Screenshot region bounds algorithm (paired shares one app build)
        type: choice
        default: stock
        options:
          - stock
          - one-pass
          - paired
      trials:
        description: Independent fresh-runner trials
        type: choice
        default: "5"
        options:
          - "1"
          - "3"
          - "5"
          - "20"
          - "60"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-e2e-test.yml"
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - "Teleport.podspec"
      - "ios/**"
      - "example/**"
      - "e2e/**"
      - "src/**"
      - "common/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ios-e2e-test.yml"
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - "Teleport.podspec"
      - "ios/**"
      - "example/**"
      - "e2e/**"
      - "src/**"
      - "common/**"
env:
  XCODE_VERSION: "16.4"
  MAESTRO_IOS_PROFILE: ${{ inputs.profile || 'native-driver' }}

jobs:
  plan-trials:
    name: Plan independent trials
    runs-on: ubuntu-latest
    outputs:
      trials: ${{ steps.trials.outputs.trials }}
    steps:
      - id: trials
        env:
          TRIAL_COUNT: ${{ inputs.trials || '1' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const count = Number(process.env.TRIAL_COUNT);
          if (!Number.isInteger(count) || count < 1 || count > 60) {
            throw new Error("Expected between 1 and 60 independent trials");
          }
          const trials = Array.from({ length: count }, (_, index) => index + 1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "trials=" + JSON.stringify(trials) + "\n");
          NODE
  inspect-hid-contract:
    name: Inspect Simulator HID contract without accessing devices
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'hid-contract'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Inspect host packet builder
        run: python3 e2e/scripts/inspect-ios-hid.py --output e2e/reports/ios-hid-contract
      - name: Preserve native contract and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-hid-contract
          path: e2e/reports/ios-hid-contract
          retention-days: 7
  build-ios:
    name: 🏗️ Build E2E ipa
    if: inputs.profile != 'hid-contract'
    runs-on: macos-15
    defaults:
      run:
        working-directory: example/ios
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: List all available simulators
        run: xcrun simctl list

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 1.5G
          key: ${{ runner.os }}-ccache-example-ios
          create-symlink: true
      - name: Setup ccache behavior
        run: |
          echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros" >> $GITHUB_ENV
          echo "CCACHE_FILECLONE=true" >> $GITHUB_ENV
          echo "CCACHE_DEPEND=true" >> $GITHUB_ENV
          echo "CCACHE_INODECACHE=true" >> $GITHUB_ENV
      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.6
          bundler-cache: true
          working-directory: example/ios

      - name: Restore Pods cache
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      # Restore build outputs before pod install regenerates codegen headers.
      - name: Restore DerivedData cache
        uses: actions/cache@v5
        with:
          path: example/ios/build
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/Podfile.lock', '**/Gemfile.lock', '**/package.json', '**/yarn.lock') }}-xcode-${{ env.XCODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-derived-data
      - name: Install Pods
        run: export USE_CCACHE=1 && pod install || pod update --repo-update
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Build App
        run: |
          set -o pipefail
          xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace TeleportExample.xcworkspace \
            -scheme TeleportExample \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            build CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Build pinned Maestro input driver
        id: maestro-input
        if: env.MAESTRO_IOS_PROFILE == 'native-driver' || env.MAESTRO_IOS_PROFILE == 'recap-source' || env.MAESTRO_IOS_PROFILE == 'indigo'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOUCH_LEAD_IN: ${{ (inputs.profile == 'recap-source' || inputs.profile == 'indigo') && '0' || '0.05' }}
          INPUT_BACKEND: ${{ inputs.profile == 'indigo' && 'indigo' || 'recap' }}
        run: |
          python3 e2e/scripts/maestro-ios-input.py build \
            --source example/ios/build/maestro-input/source \
            --derived example/ios/build/maestro-input/DerivedData \
            --output example/ios/build/maestro-input/artifact \
            --lead-in "$TOUCH_LEAD_IN" --backend "$INPUT_BACKEND"
          if [ "$INPUT_BACKEND" = indigo ]; then
            python3 -B e2e/scripts/test-maestro-ios-hid-source.py
            node --test e2e/scripts/ios-hid-bridge.test.mjs e2e/scripts/check-ios-hid-delivery.test.mjs
          fi
      - name: Upload Maestro input driver and build evidence
        if: always() && steps.maestro-input.outcome != 'skipped' && steps.maestro-input.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-input-driver
          path: example/ios/build/maestro-input/artifact
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-ipa
          path: example/ios/build/Build/Products/Release-iphonesimulator/TeleportExample.app/**

  e2e-test:
    name: ⚙️ Automated test cases (iOS-${{ matrix.devices.ios }}, trial-${{ matrix.trial }}, ${{ inputs.profile || 'native-driver' }}) / image-${{ matrix.comparison }}
    runs-on: macos-${{ matrix.devices.macos }}
    timeout-minutes: 90
    concurrency:
      group: ios-e2e-${{ matrix.devices.ios }}-${{ github.ref }}-${{ github.sha }}-${{ matrix.trial }}-${{ inputs.profile || 'native-driver' }}-${{ matrix.comparison }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        devices: [{ ios: 18, macos: 15 }]
        trial: ${{ fromJSON(needs.plan-trials.outputs.trials) }}
        comparison: ${{ fromJSON(inputs.comparison == 'paired' && '["stock", "one-pass"]' || inputs.comparison == 'one-pass' && '["one-pass"]' || '["stock"]') }}
    needs: [build-ios, plan-trials]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Disable host Spotlight indexing (comparison only)
        if: inputs.profile == 'no-spotlight'
        run: |
          set -euo pipefail
          mkdir -p e2e/reports/native-diagnostics
          {
            date -u
            echo "profile=no-spotlight"
            echo "Indexing status before intervention:"
            sudo mdutil -a -s
            sudo mdutil -a -i off
            echo "Indexing status after intervention:"
            sudo mdutil -a -s
          } | tee e2e/reports/native-diagnostics/spotlight-profile.log
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-e2e-ipa
          path: example/ios/build/Build/Products/Release-iphonesimulator/TeleportExample.app/
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install app on simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices | grep "iPhone 16 Pro (" | grep -oE "[0-9A-F-]{36}" | head -n 1)
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          open -a Simulator --args -CurrentDeviceUDID $UDID
          xcrun simctl bootstatus "$UDID"
          osascript -e 'tell application "Simulator" to activate'
          xcrun simctl install "$UDID" example/ios/build/Build/Products/Release-iphonesimulator/TeleportExample.app
      - name: Stop selected simulator's push service (comparison only)
        if: inputs.profile == 'apsd-stopped'
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # Isolate the apsd behavior from keyboard-controller's broader yeetd setup.
          # Resolve the PID inside this simulator's launchd namespace.
          APSD_PID=$(xcrun simctl spawn "$UDID" launchctl list | awk '$3 == "com.apple.apsd" {print $1}')
          test "$APSD_PID" -gt 1
          APSD_PATH=$(ps -p "$APSD_PID" -o comm=)
          case "$APSD_PATH" in
            *simruntime/Contents/Resources/RuntimeRoot/*/apsd) ;;
            *) echo "Unexpected simulator apsd path: $APSD_PATH"; exit 1 ;;
          esac
          mkdir -p e2e/reports/native-diagnostics
          {
            date -u
            echo "profile=apsd-stopped simulator=$UDID"
            ps -p "$APSD_PID" -o pid,ppid,state,pcpu,comm
            kill -STOP "$APSD_PID"
            ps -p "$APSD_PID" -o pid,ppid,state,pcpu,comm
          } | tee e2e/reports/native-diagnostics/simulator-profile.log
      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=2.10.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Log Maestro version
        run: maestro --version
      - name: Download Maestro input driver
        if: env.MAESTRO_IOS_PROFILE == 'native-driver' || env.MAESTRO_IOS_PROFILE == 'recap-source' || env.MAESTRO_IOS_PROFILE == 'indigo'
        uses: actions/download-artifact@v4
        with:
          name: maestro-ios-input-driver
          path: e2e/reports/maestro-ios-input
      - name: Install simulator input driver resources
        if: env.MAESTRO_IOS_PROFILE == 'native-driver' || env.MAESTRO_IOS_PROFILE == 'recap-source' || env.MAESTRO_IOS_PROFILE == 'indigo'
        env:
          TOUCH_LEAD_IN: ${{ (inputs.profile == 'recap-source' || inputs.profile == 'indigo') && '0' || '0.05' }}
          INPUT_BACKEND: ${{ inputs.profile == 'indigo' && 'indigo' || 'recap' }}
        run: |
          python3 e2e/scripts/maestro-ios-input.py install \
            --jar "$HOME/.maestro/lib/maestro-ios-driver.jar" \
            --artifact e2e/reports/maestro-ios-input \
            --expected-lead-in "$TOUCH_LEAD_IN" --expected-backend "$INPUT_BACKEND"
          mkdir -p e2e/reports/native-diagnostics
          cp e2e/reports/maestro-ios-input/maestro-ios-input-install.json e2e/reports/native-diagnostics/
          if [ "$INPUT_BACKEND" = indigo ]; then
            cp e2e/reports/maestro-ios-input/indigo-host-manifest.json e2e/reports/native-diagnostics/
          fi
      - name: Use simulator-native app termination
        if: env.MAESTRO_IOS_PROFILE == 'simctl-stop' || env.MAESTRO_IOS_PROFILE == 'native-driver' || env.MAESTRO_IOS_PROFILE == 'recap-source' || env.MAESTRO_IOS_PROFILE == 'indigo'
        run: |
          set -euo pipefail
          python3 e2e/scripts/patch-maestro-ios-stop.py \
            "$HOME/.maestro/lib/maestro-ios.jar" "$RUNNER_TEMP/teleport-ios-stop-patch" --install
          mkdir -p e2e/reports/native-diagnostics
          cp "$RUNNER_TEMP/teleport-ios-stop-patch/maestro-ios-stop-patch.json" e2e/reports/native-diagnostics/
          cp "$RUNNER_TEMP/teleport-ios-stop-patch/patch-helper.log" e2e/reports/native-diagnostics/ios-stop-patch-helper.log
          javap -classpath "$HOME/.maestro/lib/*" -c -p ios.LocalIOSDevice > e2e/reports/native-diagnostics/ios-stop-routing-bytecode.log
          javac -classpath "$HOME/.maestro/lib/*" -d "$RUNNER_TEMP/teleport-ios-stop-patch/fixture" \
            e2e/scripts/ios-stop-fixture/ios/xctest/XCTestIOSDevice.java \
            e2e/scripts/ios-stop-fixture/util/LocalSimulatorUtils.java \
            e2e/scripts/ios-stop-fixture/VerifyIOSStopRouting.java
          java -Xverify:all -cp "$RUNNER_TEMP/teleport-ios-stop-patch/fixture:$RUNNER_TEMP/teleport-ios-stop-patch/original:$HOME/.maestro/lib/*" \
            VerifyIOSStopRouting original | tee e2e/reports/native-diagnostics/ios-stop-routing-original.log
          java -Xverify:all -cp "$RUNNER_TEMP/teleport-ios-stop-patch/fixture:$HOME/.maestro/lib/*" \
            VerifyIOSStopRouting patched | tee e2e/reports/native-diagnostics/ios-stop-routing-patched.log
      - name: Verify screenshot comparison contract
        if: github.event_name == 'workflow_dispatch' && inputs.comparison != ''
        run: |
          set -euo pipefail
          python3 e2e/scripts/test-maestro-image-comparison.py \
            "$HOME/.maestro/lib/image-comparison-4.4.0.jar" "$RUNNER_TEMP/teleport-comparison-contract"
          mkdir -p e2e/reports/native-diagnostics
          cp "$RUNNER_TEMP/teleport-comparison-contract"/contract-*.json e2e/reports/native-diagnostics/
      - name: Use one-pass screenshot region bounds
        if: matrix.comparison == 'one-pass'
        run: |
          set -euo pipefail
          python3 e2e/scripts/patch-maestro-image-comparison.py \
            "$HOME/.maestro/lib/image-comparison-4.4.0.jar" "$RUNNER_TEMP/teleport-image-comparison" --install
          mkdir -p e2e/reports/native-diagnostics
          cp "$RUNNER_TEMP/teleport-image-comparison/maestro-image-comparison-patch.json" e2e/reports/native-diagnostics/
      - name: Ensure FFmpeg is available
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Prepare snapshot engine
        run: cd e2e && npm install
      - name: Run E2E tests
        id: e2e
        timeout-minutes: 30
        env:
          MAESTRO_IOS_INPUT_BACKEND: ${{ inputs.profile == 'indigo' && 'indigo' || 'recap' }}
          MAESTRO_IOS_HID_MANIFEST: ${{ github.workspace }}/e2e/reports/maestro-ios-input/indigo-host-manifest.json
        run: |
          set -euo pipefail
          mkdir -p e2e/reports
          node e2e/snapshot-engine.js > e2e/reports/snapshot-engine.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000
          node e2e/scripts/native-diagnostics.mjs ios "${{ steps.simulator.outputs.udid }}" -- \
            maestro --platform ios --device "${{ steps.simulator.outputs.udid }}" test \
            -e DEVICE="iPhone 16 Pro" e2e/flows/* --format html ./e2e/reports/debug \
            --debug-output ./e2e/reports/debug --flatten-debug-output
      - name: Check glitches/flickering
        run: node e2e/scripts/check-glitches.mjs e2e/reports/debug
      - name: Validate iOS touch delivery
        if: always() && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != ''
        run: |
          args=()
          if [[ "$MAESTRO_IOS_PROFILE" == "indigo" ]]; then
            xctest_logs=(e2e/reports/debug/xctest_runner*.log)
            [[ ${#xctest_logs[@]} == 1 && -f "${xctest_logs[0]}" ]]
            args=(--indigo "${xctest_logs[0]}")
          fi
          node e2e/scripts/check-ios-touch-cancellations.mjs \
            e2e/reports/native-diagnostics/simulator.log \
            e2e/reports/native-diagnostics/ios-touch-cancellations.json "${args[@]}"
      - name: Verify rebuilt input driver was used
        if: always() && (env.MAESTRO_IOS_PROFILE == 'native-driver' || env.MAESTRO_IOS_PROFILE == 'recap-source') && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != ''
        env:
          EXPECTED_LEAD_IN: ${{ inputs.profile == 'recap-source' && '0.000' || '0.050' }}
        run: |
          grep -F "[teleport-maestro-input] touchLeadInSeconds=$EXPECTED_LEAD_IN" \
            e2e/reports/native-diagnostics/simulator.log
      - name: Verify persistent Simulator HID delivery
        if: always() && env.MAESTRO_IOS_PROFILE == 'indigo' && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != ''
        run: |
          xctest_logs=(e2e/reports/debug/xctest_runner*.log)
          [[ ${#xctest_logs[@]} == 1 && -f "${xctest_logs[0]}" ]]
          node e2e/scripts/check-ios-hid-delivery.mjs \
            e2e/reports/native-diagnostics e2e/reports/native-diagnostics/ios-hid-delivery.json "${xctest_logs[0]}"
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./e2e/reports/native-diagnostics
            ./e2e/reports/snapshot-engine.log
            ./e2e/reports/debug/*.log
            ./e2e/reports/debug/**/commands.json
            ./e2e/reports/debug/**/manifest.json
          name: e2e-diagnostics-ios-${{ github.run_attempt }}-${{ matrix.trial }}${{ matrix.comparison == 'one-pass' && '-one-pass' || '' }}
          retention-days: 7
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./e2e/reports
            ./e2e/videos
          name: e2e-report-ios-${{ github.run_attempt }}-${{ matrix.trial }}${{ matrix.comparison == 'one-pass' && '-one-pass' || '' }}
