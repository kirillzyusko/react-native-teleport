name: 🤖 Test Android
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Independent fresh-runner trials
        type: choice
        default: "5"
        options:
          - "1"
          - "3"
          - "5"
          - "20"
          - "60"
      mode:
        description: Original suite, input tracing, or driver lifetime probe
        type: choice
        default: suite
        options:
          - suite
          - input-trace
          - stock-driver
          - foreground-driver
  pull_request:
    paths:
      - ".github/workflows/android-e2e-test.yml"
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - "android/**"
      - "example/**"
      - "e2e/**"
      - "src/**"
      - "common/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-e2e-test.yml"
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - "android/**"
      - "example/**"
      - "e2e/**"
      - "src/**"
      - "common/**"

jobs:
  plan-trials:
    name: Plan independent trials
    runs-on: ubuntu-latest
    outputs:
      trials: ${{ steps.trials.outputs.trials }}
    steps:
      - id: trials
        env:
          TRIAL_COUNT: ${{ inputs.mode && inputs.mode != 'suite' && inputs.mode != 'input-trace' && '1' || inputs.trials || '1' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const count = Number(process.env.TRIAL_COUNT);
          if (!Number.isInteger(count) || count < 1 || count > 60) {
            throw new Error("Expected between 1 and 60 independent trials");
          }
          const trials = Array.from({ length: count }, (_, index) => index + 1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "trials=" + JSON.stringify(trials) + "\n");
          NODE
  build-android:
    name: 🏗️ Build E2E apk
    runs-on: ubuntu-latest
    concurrency:
      group: android-e2e-${{ github.ref }}-${{ github.sha }}-${{ inputs.mode || 'suite' }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set app active arch
        run: sed -i.bak 's/reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' example/android/gradle.properties
      - name: Run Gradle Build for example/android/
        env:
          TELEPORT_INPUT_TRACE: ${{ inputs.mode == 'input-trace' && 'true' || 'false' }}
        run: cd example/android && ./gradlew assembleRelease --build-cache -PteleportInputTrace="$TELEPORT_INPUT_TRACE" && cd ../..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-apk
          path: example/android/app/build/outputs/apk/**

  e2e-test:
    name: ⚙️ Automated test cases (API-${{ matrix.devices.api }}, trial-${{ matrix.trial }}, ${{ inputs.mode || 'suite' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKING_DIRECTORY: example
      NATIVE_MODE: ${{ inputs.mode || 'suite' }}
    concurrency:
      group: android-e2e-${{ matrix.devices.api }}-${{ github.ref }}-${{ github.sha }}-${{ matrix.trial }}-${{ inputs.mode || 'suite' }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        devices: [{ api: 31, target: google_apis }]
        trial: ${{ fromJSON(needs.plan-trials.outputs.trials) }}
    needs: [build-android, plan-trials]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # force to remove default tools
          tool-cache: true
          # preserve Android
          android: false
      - name: Use project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: android-e2e-apk
          path: example/android/app/build/outputs/apk/
      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.10.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000
      - name: Log Maestro version
        run: maestro --version
      - name: Ensure FFmpeg is available
        if: ${{ !inputs.mode || inputs.mode == 'suite' || inputs.mode == 'input-trace' }}
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.devices.api }}-${{ matrix.devices.target }}
      - name: Prepare snapshot engine
        if: ${{ !inputs.mode || inputs.mode == 'suite' || inputs.mode == 'input-trace' }}
        run: cd e2e && npm install

      - name: Start snapshot engine (background)
        if: ${{ !inputs.mode || inputs.mode == 'suite' || inputs.mode == 'input-trace' }}
        shell: bash
        run: |
          mkdir -p e2e/reports
          node e2e/snapshot-engine.js > e2e/reports/snapshot-engine.log 2>&1 &
          echo $! > server.pid
      - name: Run emulator and tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: ${{ matrix.devices.api }}
          target: ${{ matrix.devices.target }}
          cores: 4
          profile: pixel_2
          ram-size: "4096M"
          disk-size: "10G"
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          avd-name: e2e_emulator_${{ matrix.devices.api }}
          emulator-port: 5554
          arch: x86_64
          script: |
            adb install -r -d -t example/android/app/build/outputs/apk/release/app-release.apk
            bash e2e/scripts/run-android-ci.sh "$NATIVE_MODE" emulator-5554
      - name: Show snapshot engine logs
        if: ${{ always() && (!inputs.mode || inputs.mode == 'suite' || inputs.mode == 'input-trace') }}
        run: |
          cat e2e/reports/snapshot-engine.log || true
      - name: Check glitches/flickering
        if: ${{ !inputs.mode || inputs.mode == 'suite' || inputs.mode == 'input-trace' }}
        run: node e2e/scripts/check-glitches.mjs e2e/reports/debug
      - name: Verify Android input tracing
        if: ${{ always() && inputs.mode == 'input-trace' }}
        run: |
          grep -q 'TeleportInputTrace.*"phase":"installed"' e2e/reports/native-diagnostics/logcat.log
          grep -q 'TeleportInputTrace.*"phase":"received"' e2e/reports/native-diagnostics/logcat.log
          grep -q '\[teleport-input\].*"phase":"installed"' e2e/reports/native-diagnostics/logcat.log
          if grep -q '\[teleport-input\].*"phase":"overflow"' e2e/reports/native-diagnostics/logcat.log; then exit 1; fi
          if grep -q 'TeleportInputTrace.*trace.error' e2e/reports/native-diagnostics/logcat.log; then exit 1; fi
      - name: Kill snapshot engine
        if: always()
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm -f server.pid
          fi
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./e2e/reports/native-diagnostics
            ./e2e/reports/snapshot-engine.log
            ./e2e/reports/debug/*.log
            ./e2e/reports/debug/**/commands.json
            ./e2e/reports/debug/**/manifest.json
          name: e2e-diagnostics-android-${{ github.run_attempt }}-${{ matrix.trial }}
          retention-days: 7
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./e2e/reports
            ./e2e/videos
          name: e2e-report-android-${{ github.run_attempt }}-${{ matrix.trial }}
