name: 📦 Build iOS with SPM
# cspell:ignore nvmrc yarnrc lobanov pipefail deintegrate iphonesimulator xcresult

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ios-spm.yml"
      - ".github/actions/setup/**"
      - ".nvmrc"
      - ".yarnrc.yml"
      - "Package.swift"
      - "Teleport.podspec"
      - "package.json"
      - "yarn.lock"
      - "react-native.config.js"
      - "ios/**"
      - "common/**"
      - "src/**"
      - "example/**"
  pull_request:
    paths:
      - ".github/workflows/build-ios-spm.yml"
      - ".github/actions/setup/**"
      - ".nvmrc"
      - ".yarnrc.yml"
      - "Package.swift"
      - "Teleport.podspec"
      - "package.json"
      - "yarn.lock"
      - "react-native.config.js"
      - "ios/**"
      - "common/**"
      - "src/**"
      - "example/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-spm-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  TELEPORT_SPM_ONLY: "1"

jobs:
  build:
    name: 🏗️ SPM (Release)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache React Native SPM artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-spm-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode-${{ env.XCODE_VERSION }}-

      - name: Configure Swift Package Manager
        working-directory: example/ios
        run: |
          set -o pipefail
          yarn react-native spm add --deintegrate --yes 2>&1 | tee spm-setup.log

      - name: Build the app
        working-directory: example/ios
        env:
          ENTRY_FILE: index.spm.js
        run: |
          set -o pipefail
          test -f TeleportExample.xcodeproj/.spm-injected.json
          xcodebuild \
            -project TeleportExample.xcodeproj \
            -scheme TeleportExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -resultBundlePath build-Release.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-Release.log

      - name: Upload SPM and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spm-Release
          path: |
            example/ios/spm-setup.log
            example/ios/build-Release.log
            example/ios/build-Release.xcresult
